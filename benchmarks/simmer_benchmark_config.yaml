# =========================================================================
# ChemGIME vs. SIMMER Sub-sampling Benchmark Configuration
# =========================================================================
# Maps each of the 33 SIMMER positive-control reactions to:
#   (a) its full reaction SMILES (left >> right),
#   (b) the single organism GEM to restrict the search to,
#   (c) the positive-control enzyme expected in the output.
#
# Reaction SMILES sourced from SIMMER_smiles.tsv (DM identifiers).
# GEM paths point to AGORA2 SBML files; update to local locations.
# =========================================================================

gem_dir: /data/gems/agora2   # base directory for SBML files

gems:
  ecoli:
    file: Escherichia_coli_str_K_12_substr_MG1655.xml
    organism: Escherichia coli K-12 MG1655
    taxid: 83333
  btheta:
    file: Bacteroides_thetaiotaomicron_VPI_5482.xml
    organism: Bacteroides thetaiotaomicron VPI-5482
    taxid: 226186
  cscindens:
    file: Clostridium_scindens_ATCC_35704.xml
    organism: Clostridium scindens ATCC 35704
    taxid: 29347
  elenta:
    file: Eggerthella_lenta_DSM_2243.xml
    organism: Eggerthella lenta DSM 2243
    taxid: 519435
  efaecalis:
    file: Enterococcus_faecalis_V583.xml
    organism: Enterococcus faecalis V583
    taxid: 1351
  csporogenes:
    file: Clostridium_sporogenes_ATCC_15579.xml
    organism: Clostridium sporogenes ATCC 15579
    taxid: 1509
  cinnocuum:
    file: Clostridium_innocuum.xml
    organism: Clostridium innocuum
    taxid: 1522

